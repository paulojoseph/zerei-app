name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the performance test for the "Beat it!" click with the full catalog.
      - run: npm test

  worker:
    name: Worker build (OpenNext) and size limit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx opennextjs-cloudflare build
      - name: Worker fits the free plan (3MB gzip)
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/worker | tee /tmp/dry-run.log
          gzip_kib=$(grep -oP 'gzip: \K[0-9.]+' /tmp/dry-run.log | tail -1)
          echo "Worker: ${gzip_kib} KiB gzip"
          echo "### Worker: ${gzip_kib} KiB gzip (limit 3072)" >> "$GITHUB_STEP_SUMMARY"
          awk -v s="$gzip_kib" 'BEGIN { exit (s > 3072) }'

  lighthouse:
    name: Performance budget (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Ratchet: the limits in lighthouserc.json start from the measured baseline
      # (docs/adr/0003) and only move up. No PR can make things worse.
      - run: npx -y @lhci/cli@0.15 autorun
